<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="مسار يومي للتعلم والمتابعة">
<link rel="manifest" href="manifest.webmanifest">
<title>مساري</title>
<style>
:root{--bg:#f5f2ea;--surface:#fffdf8;--surface2:#f0eadf;--text:#25231f;--muted:#817b70;--line:#e3dccf;--accent:#c4775d;--accent2:#7f9b83;--ok:#78947d;--shadow:0 12px 35px rgba(55,45,30,.08)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#efe5d5 0,#f5f2ea 35%,#f7f5ef 100%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;border:0;cursor:pointer}.app{max-width:1050px;margin:auto;padding:28px 18px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font-weight:950;font-size:27px;letter-spacing:-.5px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.3px;margin-top:1px}.install{background:var(--text);color:#fffdf8;padding:11px 15px;border-radius:13px;font-weight:800;box-shadow:var(--shadow)}
.page{display:none}.page.active{display:block}.title{font-size:36px;letter-spacing:-1.2px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 24px;font-size:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:rgba(255,253,248,.78);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.stat b{display:block;font-size:27px;letter-spacing:-.7px}.stat span{font-size:12px;color:var(--muted)}
.card{background:rgba(255,253,248,.84);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}.bar{height:12px;background:#e8e1d5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:.35s}
.tasks{display:grid;gap:12px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 7px 22px rgba(55,45,30,.05);transition:.2s}.task:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.task.done{border-color:#9db3a166;background:#f1f5ee}.check{width:34px;height:34px;border-radius:11px;border:2px solid #cfc6b8;background:transparent;color:#fff;font-weight:900}.done .check{background:var(--ok);border-color:var(--ok)}.task h3{margin:0;font-size:17px}.task p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.time{font-size:12px;color:#746b5e;background:var(--surface2);border:1px solid var(--line);padding:7px 10px;border-radius:10px;white-space:nowrap}
.calendar{display:grid;gap:10px}.card h2{margin:0 0 15px;font-size:19px}.day{display:grid;grid-template-columns:105px 1fr 45px;align-items:center;gap:10px;font-size:13px}.mini{height:8px;border-radius:99px;background:#e8e1d5;overflow:hidden}.mini i{display:block;height:100%;background:var(--accent2);border-radius:99px}.note,.empty{color:var(--muted);font-size:12px}.danger{color:#b65d57;background:#f7e8e4;padding:10px 13px;border-radius:11px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(250,248,242,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav{color:var(--muted);background:transparent;padding:10px 20px;border-radius:13px;font-weight:750}.nav.active{background:var(--text);color:#fffdf8}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--text);color:#fffdf8;padding:11px 16px;border-radius:13px;transition:.2s;z-index:9;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.app{padding:22px 14px 100px}.summary{grid-template-columns:repeat(2,1fr)}.title{font-size:30px}.task{grid-template-columns:auto 1fr}.time{grid-column:2;justify-self:start}.day{grid-template-columns:75px 1fr 35px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">مساري <small>Ultimate Play</small></div><button id="install" class="install" hidden>تثبيت التطبيق</button></header>

<section id="today" class="page active">
<h1 class="title">مهام اليوم</h1><p class="sub" id="todayDate"></p>
<div class="summary">
<div class="stat"><b id="todayCount">0/6</b><span>اليوم</span></div>
<div class="stat"><b id="todayPct">0%</b><span>الإنجاز</span></div>
<div class="stat"><b id="streak">0</b><span>سلسلة الأيام</span></div>
<div class="stat"><b id="allDone">0</b><span>كل المهام</span></div>
</div>
<div class="card"><div class="bar"><i id="todayBar"></i></div></div>
<div id="tasks" class="tasks"></div>
</section>

<section id="progress" class="page">
<h1 class="title">التقدم</h1><p class="sub">شوف واش درت في كل يوم، بلا تعقيد.</p>
<div class="summary"><div class="stat"><b id="pDays">0</b><span>أيام منجزة</span></div><div class="stat"><b id="pAvg">0%</b><span>متوسط الإنجاز</span></div><div class="stat"><b id="pBest">0/6</b><span>أفضل يوم</span></div><div class="stat"><b id="pTotal">0</b><span>إجمالي المهام</span></div></div>
<div class="card"><h2>كل الأيام</h2><div id="calendar" class="calendar"></div></div>
<div class="card"><button id="reset" class="danger">مسح كل التقدم</button></div>
</section>
</div>
<nav class="bottom"><button class="nav active" data-page="today">📋 اليوم</button><button class="nav" data-page="progress">📈 التقدم</button></nav>
<div id="toast" class="toast"></div>
<script>
const tasks=[
['history','🏛️','تاريخ','درس/فيديو/قراءة + كتابة أهم الأفكار','30–45 د'],
['brain','🧠','أعصاب وسلوك','تعلم مفهوم واحد بتركيز + شرحو بكلامك','30–60 د'],
['sharia','📖','شرعي','درس/شرح/قراءة من مصدر موثوق + استخراج الفوائد','حسب الدرس'],
['logic','🧮','منطق ونقد','حجة، مغالطة، تمرين منطقي، أو تحليل نقاش','20–30 د'],
['books','📚','كتب ومطالعة','كتاب أصلي أو ملخص/شرح كتاب','20–40 د'],
['review','🔁','مراجعة','استرجاع ما تعلمته سابقًا بدون النظر للملاحظات','15–20 د']
];
const KEY='masari-progress-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');
function key(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function day(k=key()){return data.days[k]||{}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function count(k){return tasks.filter(t=>day(k)[t[0]]).length}
function toggle(id){let k=key();data.days[k]={...day(k),[id]:!day(k)[id]};save();toast('تم الحفظ تلقائيًا ✓')}
function streak(){let n=0,d=new Date();while(count(key(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
 const k=key(),n=count(k),pct=Math.round(n/6*100);$('todayDate').textContent=new Date().toLocaleDateString('ar-DZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('todayCount').textContent=n+'/6';$('todayPct').textContent=pct+'%';$('streak').textContent=streak();$('allDone').textContent=Object.keys(data.days).reduce((a,k)=>a+count(k),0);$('todayBar').style.width=pct+'%';
 $('tasks').innerHTML=tasks.map(t=>{let done=!!day()[t[0]];return '<article class="task '+(done?'done':'')+'"><button class="check" onclick="toggle(\''+t[0]+'\')">'+(done?'✓':'')+'</button><div><h3>'+t[1]+' '+t[2]+'</h3><p>'+t[3]+'</p></div><span class="time">'+t[4]+'</span></article>'}).join('');
 let keys=Object.keys(data.days).sort().reverse(),days=keys.length,avg=days?Math.round(keys.reduce((a,k)=>a+count(k),0)/(days*6)*100):0,best=keys.reduce((m,k)=>Math.max(m,count(k)),0);
 $('pDays').textContent=days;$('pAvg').textContent=avg+'%';$('pBest').textContent=best+'/6';$('pTotal').textContent=keys.reduce((a,k)=>a+count(k),0);
 $('calendar').innerHTML=keys.length?keys.map(k=>{let n=count(k),p=Math.round(n/6*100),d=new Date(k+'T12:00:00');return '<div class="day"><span>'+d.toLocaleDateString('ar-DZ',{weekday:'short',day:'numeric',month:'short'})+'</span><div class="mini"><i style="width:'+p+'%"></i></div><b>'+n+'/6</b></div>'}).join(''):'<div class="empty">مازال ما عندك حتى يوم مسجل.</div>';
}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.page).classList.add('active');render()});
$('reset').onclick=()=>{if(confirm('تمسح كامل التقدم؟')){data={days:{}};save();toast('تم المسح')}}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').hidden=false});$('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
