<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="مسار يومي للتعلم والمتابعة">
<link rel="manifest" href="manifest.webmanifest">
<title>مساري</title>
<style>
:root{--bg:#09090b;--surface:#111113;--surface2:#18181b;--text:#f4f1ea;--muted:#99938a;--line:#292826;--accent:#d27a55;--accent2:#8fa68b;--glow:#d27a5538;--ok:#91aa91}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#4d2b1d33,transparent 32%),radial-gradient(circle at 90% 25%,#53664b22,transparent 30%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-40%;pointer-events:none;background:conic-gradient(from 90deg,transparent,#d27a5507,transparent,#8fa68b07,transparent);animation:spin 22s linear infinite;z-index:-1}@keyframes spin{to{transform:rotate(360deg)}}
button{font:inherit;border:0;cursor:pointer}.app{max-width:1080px;margin:auto;padding:30px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;animation:drop .7s ease both}.brand{font-weight:950;font-size:29px;letter-spacing:-1px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:1.5px;margin-top:2px}.install{color:#18130f;background:linear-gradient(135deg,#e19a75,#b9674b);padding:11px 16px;border-radius:13px;font-weight:850;box-shadow:0 0 25px var(--glow);transition:.25s}.install:hover{transform:translateY(-2px) scale(1.03)}
.page{display:none}.page.active{display:block;animation:pageIn .55s cubic-bezier(.2,.8,.2,1) both}@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
.title{font-size:42px;letter-spacing:-1.8px;margin:0 0 5px;background:linear-gradient(90deg,#fff,#d6c7b9);-webkit-background-clip:text;color:transparent}.sub{color:var(--muted);margin:0 0 25px;font-size:14px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{position:relative;overflow:hidden;background:linear-gradient(145deg,#151517,#101012);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:0 14px 35px #0006;transition:.3s}.stat:after{content:"";position:absolute;width:70px;height:70px;right:-28px;top:-28px;background:var(--glow);filter:blur(18px);border-radius:50%}.stat:hover{transform:translateY(-5px);border-color:#4a4039}.stat b{display:block;font-size:29px;letter-spacing:-1px}.stat span{font-size:11px;color:var(--muted)}
.card{background:#111113d9;border:1px solid var(--line);border-radius:24px;padding:19px;margin-bottom:14px;box-shadow:0 18px 45px #0007;backdrop-filter:blur(15px)}.bar{height:12px;background:#201f1e;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 5px #000}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 18px #d27a5566;border-radius:99px;transition:width .7s cubic-bezier(.2,.9,.2,1)}
.tasks{display:grid;gap:13px}.task{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;background:linear-gradient(135deg,#141416,#101012);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 9px 25px #0006;overflow:hidden;opacity:0;animation:taskIn .55s cubic-bezier(.2,.8,.2,1) forwards;transition:.3s}.task:nth-child(1){animation-delay:.04s}.task:nth-child(2){animation-delay:.09s}.task:nth-child(3){animation-delay:.14s}.task:nth-child(4){animation-delay:.19s}.task:nth-child(5){animation-delay:.24s}.task:nth-child(6){animation-delay:.29s}@keyframes taskIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}.task:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,#d27a5508,transparent);transform:translateX(110%);transition:.5s}.task:hover:before{transform:translateX(-110%)}.task:hover{transform:translateY(-4px) scale(1.008);border-color:#514138;box-shadow:0 16px 35px #0008}.task.done{border-color:#536a5666;background:linear-gradient(135deg,#131713,#101210)}.check{width:37px;height:37px;border-radius:12px;border:1px solid #484541;background:#191918;color:#fff;font-weight:950;transition:.3s;position:relative;z-index:1}.check:hover{border-color:var(--accent);transform:rotate(-7deg) scale(1.08)}.done .check{background:linear-gradient(135deg,#9bb49a,#637d66);border-color:#9bb49a;color:#10140f;box-shadow:0 0 22px #8fa68b55;animation:pop .35s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{50%{transform:scale(1.2) rotate(5deg)}}.task h3{margin:0;font-size:17px}.task p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.time{font-size:11px;color:#b8aea3;background:#1a1918;border:1px solid #302e2b;padding:7px 10px;border-radius:10px;white-space:nowrap}
.calendar{display:grid;gap:10px}.card h2{margin:0 0 15px;font-size:19px}.day{display:grid;grid-template-columns:105px 1fr 45px;align-items:center;gap:10px;font-size:13px;animation:fade .4s both}.mini{height:8px;border-radius:99px;background:#242321;overflow:hidden}.mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),#b2b78d);border-radius:99px;box-shadow:0 0 10px #8fa68b55}.empty{color:var(--muted);font-size:12px}.danger{color:#d98980;background:#301b1a;padding:10px 13px;border-radius:11px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c0c0de8;backdrop-filter:blur(22px);border-top:1px solid #292826;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav{color:#77736d;background:transparent;padding:10px 22px;border-radius:14px;font-weight:800;transition:.3s}.nav.active{color:#f4f1ea;background:#211f1d;box-shadow:inset 0 0 0 1px #39332e,0 0 20px #0008}.nav:hover{color:#fff;transform:translateY(-2px)}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-25px) scale(.9);opacity:0;background:#191817ee;color:#fff1e7;padding:11px 17px;border-radius:13px;border:1px solid #4a3b32;transition:.3s;z-index:9;box-shadow:0 10px 35px #0009;backdrop-filter:blur(15px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.app{padding:23px 14px 105px}.summary{grid-template-columns:repeat(2,1fr)}.title{font-size:33px}.task{grid-template-columns:auto 1fr}.time{grid-column:2;justify-self:start}.day{grid-template-columns:75px 1fr 35px}.brand{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">مساري <small>Ultimate Play</small></div><button id="install" class="install" hidden>تثبيت التطبيق</button></header>

<section id="today" class="page active">
<h1 class="title">مهام اليوم</h1><p class="sub" id="todayDate"></p>
<div class="summary">
<div class="stat"><b id="todayCount">0/6</b><span>اليوم</span></div>
<div class="stat"><b id="todayPct">0%</b><span>الإنجاز</span></div>
<div class="stat"><b id="streak">0</b><span>سلسلة الأيام</span></div>
<div class="stat"><b id="allDone">0</b><span>كل المهام</span></div>
</div>
<div class="card"><div class="bar"><i id="todayBar"></i></div></div>
<div id="tasks" class="tasks"></div>
</section>

<section id="progress" class="page">
<h1 class="title">التقدم</h1><p class="sub">شوف واش درت في كل يوم، بلا تعقيد.</p>
<div class="summary"><div class="stat"><b id="pDays">0</b><span>أيام منجزة</span></div><div class="stat"><b id="pAvg">0%</b><span>متوسط الإنجاز</span></div><div class="stat"><b id="pBest">0/6</b><span>أفضل يوم</span></div><div class="stat"><b id="pTotal">0</b><span>إجمالي المهام</span></div></div>
<div class="card"><h2>كل الأيام</h2><div id="calendar" class="calendar"></div></div>
<div class="card"><button id="reset" class="danger">مسح كل التقدم</button></div>
</section>
</div>
<nav class="bottom"><button class="nav active" data-page="today">📋 اليوم</button><button class="nav" data-page="progress">📈 التقدم</button></nav>
<div id="toast" class="toast"></div>
<script>
const tasks=[
['history','🏛️','تاريخ','درس/فيديو/قراءة + كتابة أهم الأفكار','30–45 د'],
['brain','🧠','أعصاب وسلوك','تعلم مفهوم واحد بتركيز + شرحو بكلامك','30–60 د'],
['sharia','📖','شرعي','درس/شرح/قراءة من مصدر موثوق + استخراج الفوائد','حسب الدرس'],
['logic','🧮','منطق ونقد','حجة، مغالطة، تمرين منطقي، أو تحليل نقاش','20–30 د'],
['books','📚','كتب ومطالعة','كتاب أصلي أو ملخص/شرح كتاب','20–40 د'],
['review','🔁','مراجعة','استرجاع ما تعلمته سابقًا بدون النظر للملاحظات','15–20 د']
];
const KEY='masari-progress-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"days":{}}');
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0');
function key(d=new Date()){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function day(k=key()){return data.days[k]||{}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function count(k){return tasks.filter(t=>day(k)[t[0]]).length}
function toggle(id){let k=key();data.days[k]={...day(k),[id]:!day(k)[id]};save();toast('تم الحفظ تلقائيًا ✓')}
function streak(){let n=0,d=new Date();while(count(key(d))){n++;d.setDate(d.getDate()-1)}return n}
function render(){
 const k=key(),n=count(k),pct=Math.round(n/6*100);$('todayDate').textContent=new Date().toLocaleDateString('ar-DZ',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('todayCount').textContent=n+'/6';$('todayPct').textContent=pct+'%';$('streak').textContent=streak();$('allDone').textContent=Object.keys(data.days).reduce((a,k)=>a+count(k),0);$('todayBar').style.width=pct+'%';
 $('tasks').innerHTML=tasks.map(t=>{let done=!!day()[t[0]];return '<article class="task '+(done?'done':'')+'"><button class="check" onclick="toggle(\''+t[0]+'\')">'+(done?'✓':'')+'</button><div><h3>'+t[1]+' '+t[2]+'</h3><p>'+t[3]+'</p></div><span class="time">'+t[4]+'</span></article>'}).join('');
 let keys=Object.keys(data.days).sort().reverse(),days=keys.length,avg=days?Math.round(keys.reduce((a,k)=>a+count(k),0)/(days*6)*100):0,best=keys.reduce((m,k)=>Math.max(m,count(k)),0);
 $('pDays').textContent=days;$('pAvg').textContent=avg+'%';$('pBest').textContent=best+'/6';$('pTotal').textContent=keys.reduce((a,k)=>a+count(k),0);
 $('calendar').innerHTML=keys.length?keys.map(k=>{let n=count(k),p=Math.round(n/6*100),d=new Date(k+'T12:00:00');return '<div class="day"><span>'+d.toLocaleDateString('ar-DZ',{weekday:'short',day:'numeric',month:'short'})+'</span><div class="mini"><i style="width:'+p+'%"></i></div><b>'+n+'/6</b></div>'}).join(''):'<div class="empty">مازال ما عندك حتى يوم مسجل.</div>';
}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.page).classList.add('active');render()});
$('reset').onclick=()=>{if(confirm('تمسح كامل التقدم؟')){data={days:{}};save();toast('تم المسح')}}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').hidden=false});$('install').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').hidden=true};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
